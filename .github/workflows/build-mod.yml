# Сборка мода gddiff Window Probe на серверах GitHub (Windows).
# Готовый файл .geode кладётся в папку dist/ этой ветки и в Artifacts запуска.
name: Build probe mod

on:
  workflow_dispatch:
  push:
    paths:
      - "probe/**"
      - ".github/workflows/build-mod.yml"

permissions:
  contents: write

jobs:
  # Ядра мода (без игры) собираются и проходят тесты компилятором MSVC: те же, что собирает мод.
  # Ошибки выводятся как аннотации, их видно без скачивания логов.
  core-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build and run core tests (MSVC)
        shell: pwsh
        working-directory: probe
        run: |
          $failed = $false
          $targets = @(
            @("test_core", @("tests/test_core.cpp", "src/core/probe_core.cpp")),
            @("test_solve", @("tests/test_solve.cpp", "src/core/solve_core.cpp", "src/core/probe_core.cpp")),
            @("test_difficulty", @("tests/test_difficulty.cpp", "src/core/difficulty.cpp")),
            @("test_macro_io", @("tests/test_macro_io.cpp", "src/core/macro_io.cpp", "src/core/probe_core.cpp", "src/core/solve_core.cpp"))
          )
          foreach ($t in $targets) {
            $name = $t[0]
            $out = & cl /nologo /std:c++20 /EHsc /W3 /utf-8 /O2 /I src "/Fe:$name.exe" "/Fo:$name-" $t[1] 2>&1
            if ($LASTEXITCODE -ne 0) {
              $failed = $true
              foreach ($line in $out) { if ("$line" -match "error|warning") { Write-Host "::error::$name $line" } }
              continue
            }
            $run = & ".\$name.exe" 2>&1
            Write-Host "$name : $run"
            if ($LASTEXITCODE -ne 0) { $failed = $true; Write-Host "::error::$name tests failed: $run" }
          }
          if ($failed) { exit 1 }

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          path: probe

      - uses: actions/upload-artifact@v7
        with:
          name: gddiff-window-probe
          path: ${{ steps.build.outputs.build-output }}

      - name: Commit the built mod to dist/
        shell: bash
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          mkdir -p dist
          find "$BUILD_OUTPUT" -name '*.geode' -exec cp {} dist/ \;
          ls -la dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Собранный мод для ${GITHUB_SHA::7}" || exit 0
          git push
