# Сборка мода gddiff Window Probe на серверах GitHub (Windows).
# Готовый файл .geode кладётся в папку dist/ этой ветки и в Artifacts запуска.
name: Build probe mod

on:
  workflow_dispatch:
  push:
    paths:
      - "probe/**"
      - ".github/workflows/build-mod.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          path: probe

      - uses: actions/upload-artifact@v7
        with:
          name: gddiff-window-probe
          path: ${{ steps.build.outputs.build-output }}

      - name: Commit the built mod to dist/
        shell: bash
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          mkdir -p dist
          find "$BUILD_OUTPUT" -name '*.geode' -exec cp {} dist/ \;
          ls -la dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Собранный мод для ${GITHUB_SHA::7}" || exit 0
          git push
